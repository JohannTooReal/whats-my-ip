<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050816">
  <meta name="description" content="Check the public IP address visible to the internet.">
  <title>Public IP Address Checker</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050816;
      --panel: rgba(12, 18, 38, .76);
      --line: rgba(120, 150, 255, .2);
      --text: #f5f7ff;
      --muted: #98a4c2;
      --accent: #65d8ff;
      --accent2: #9a72ff;
      --good: #55f0a7;
      --danger: #ff829c;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100svh;
      margin: 0;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      isolation: isolate;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 42%, rgba(70, 100, 255, .17), transparent 38%),
        radial-gradient(ellipse at 10% 90%, rgba(0, 220, 255, .09), transparent 34%),
        var(--bg);
    }

    /* Static grid: avoids animating a large full-screen background. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      opacity: .28;
      background-image:
        linear-gradient(rgba(255,255,255,.027) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.027) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent);
    }

    .ambient {
      position: fixed;
      z-index: -1;
      width: clamp(230px, 40vw, 480px);
      aspect-ratio: 1;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(68px);
      opacity: .19;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      animation: drift 16s cubic-bezier(.45, 0, .55, 1) infinite alternate;
    }
    .ambient.one {
      top: -180px;
      left: -130px;
      background: #5546ff;
    }
    .ambient.two {
      right: -170px;
      bottom: -180px;
      background: #00d9ff;
      animation-duration: 21s;
      animation-delay: -7s;
    }
    .ambient.three {
      top: 42%;
      left: 72%;
      width: clamp(140px, 22vw, 260px);
      background: #a34dff;
      opacity: .1;
      animation-duration: 18s;
      animation-delay: -11s;
    }

    .container {
      position: relative;
      width: min(100%, 570px);
      padding: clamp(28px, 5vw, 44px) clamp(20px, 5vw, 42px) 34px;
      text-align: center;
      border: 1px solid transparent;
      border-radius: 28px;
      background:
        linear-gradient(145deg, rgba(20,28,57,.88), rgba(7,11,27,.84)) padding-box,
        linear-gradient(135deg, rgba(101,216,255,.42), rgba(139,92,246,.24), rgba(101,216,255,.12)) border-box;
      box-shadow: 0 30px 100px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
      animation: card-enter .8s cubic-bezier(.16, 1, .3, 1) both;
    }

    .container::before {
      content: "";
      position: absolute;
      inset: -40% -70%;
      pointer-events: none;
      background: linear-gradient(110deg, transparent 42%, rgba(101,216,255,.055) 49%, rgba(180,160,255,.09) 51%, transparent 58%);
      transform: translate3d(-35%, 0, 0) rotate(8deg);
      animation: glass-sweep 10s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    .content { position: relative; z-index: 1; }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      font-size: 34px;
      background: linear-gradient(135deg, rgba(101,216,255,.2), rgba(139,92,246,.25));
      border: 1px solid rgba(130,160,255,.28);
      box-shadow: 0 0 35px rgba(101,216,255,.12), inset 0 1px rgba(255,255,255,.12);
      transform: translateZ(0);
      animation: logo-hover 4.2s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 38px);
      letter-spacing: -1.5px;
      line-height: 1.08;
    }
    .subtitle {
      margin: 12px 0 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }
    #status {
      min-height: 22px;
      margin: 0 0 13px;
      color: #b7c2dc;
      font-size: 13px;
      line-height: 1.5;
    }
    #ip {
      position: relative;
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0 27px;
      padding: 18px 14px;
      overflow: hidden;
      border: 1px solid rgba(120,150,255,.17);
      border-radius: 18px;
      background: rgba(3,7,20,.55);
      color: var(--accent);
      font: 700 clamp(24px, 5.8vw, 37px)/1.15 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      letter-spacing: .7px;
      text-shadow: 0 0 22px rgba(101,216,255,.35);
      overflow-wrap: anywhere;
    }
    #ip::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 -45%;
      width: 36%;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(101,216,255,.12), transparent);
      transform: skewX(-18deg);
      animation: ip-scan 3.4s ease-in-out infinite;
    }
    #ip[data-state="ready"]::before { opacity: .35; }
    .loading-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font: 500 15px/1.4 inherit;
      letter-spacing: 0;
      color: #dce6ff;
      text-shadow: none;
    }
    .loader {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(101,216,255,.16);
      border-top-color: var(--accent);
      border-right-color: var(--accent2);
      box-shadow: 0 0 18px rgba(101,216,255,.18);
      animation: spin .85s linear infinite;
    }
    .loader::after {
      content: "";
      display: block;
      width: 10px;
      height: 10px;
      margin: 7px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.1);
      border-bottom-color: var(--accent);
      animation: spin 1.25s linear infinite reverse;
    }

    .progress {
      height: 3px;
      margin: -13px 0 27px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.065);
    }
    .progress-bar {
      width: 28%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent2), var(--accent), #76f3cf);
      box-shadow: 0 0 14px rgba(101,216,255,.55);
      animation: progress-glide 2s cubic-bezier(.55, 0, .35, 1) infinite;
    }
    .progress[hidden] { display: none; }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    button {
      min-width: 150px;
      padding: 13px 18px;
      border: 1px solid rgba(120,150,255,.22);
      border-radius: 14px;
      color: var(--text);
      background: rgba(255,255,255,.055);
      cursor: pointer;
      font: 600 14px/1.2 inherit;
      transition: transform .22s ease, box-shadow .22s ease, background-color .22s ease, border-color .22s ease;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      background: rgba(255,255,255,.1);
      border-color: rgba(101,216,255,.35);
      box-shadow: 0 10px 28px rgba(0,0,0,.22);
    }
    button:active:not(:disabled) { transform: translateY(0) scale(.985); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    #copyBtn {
      color: #03131b;
      border: 0;
      background: linear-gradient(115deg, var(--accent), #76f3cf);
      box-shadow: 0 8px 25px rgba(101,216,255,.17);
    }
    #copyBtn:hover:not(:disabled) { box-shadow: 0 12px 34px rgba(101,216,255,.28); }
    button:disabled { opacity: .4; cursor: not-allowed; }
    #retryBtn[hidden] { display: none; }

    .error {
      display: inline-block;
      padding: 10px 13px;
      border: 1px solid rgba(255,102,133,.24);
      border-radius: 12px;
      color: #ff9eb1;
      background: rgba(255,70,100,.08);
      animation: error-enter .32s ease both;
    }
    .success-message {
      display: block;
      margin-top: 14px;
      color: var(--good);
      font-size: 13px;
      animation: message-enter .28s ease both;
    }
    .meta {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      margin-top: 25px;
      color: #7783a2;
      font-size: 10px;
      letter-spacing: .45px;
    }
    .dot {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--good);
      box-shadow: 0 0 10px var(--good);
      animation: status-pulse 2s ease-in-out infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes drift {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      35% { transform: translate3d(42px, 30px, 0) scale(1.08); }
      70% { transform: translate3d(-22px, 58px, 0) scale(.94); }
      100% { transform: translate3d(28px, -18px, 0) scale(1.04); }
    }
    @keyframes logo-hover {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      25% { transform: translate3d(0, -5px, 0) rotate(-1deg); }
      60% { transform: translate3d(0, -2px, 0) rotate(1.5deg); }
    }
    @keyframes card-enter {
      from { opacity: 0; transform: translate3d(0, 24px, 0) scale(.975); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    @keyframes glass-sweep {
      0%, 15% { transform: translate3d(-38%, 0, 0) rotate(8deg); }
      65%, 100% { transform: translate3d(38%, 0, 0) rotate(8deg); }
    }
    @keyframes ip-scan {
      0%, 12% { transform: translateX(0) skewX(-18deg); opacity: 0; }
      25% { opacity: 1; }
      75% { opacity: 1; }
      100% { transform: translateX(430%) skewX(-18deg); opacity: 0; }
    }
    @keyframes progress-glide {
      0% { transform: translateX(-130%); }
      55% { transform: translateX(190%); }
      100% { transform: translateX(430%); }
    }
    @keyframes status-pulse {
      0%, 100% { opacity: .5; transform: scale(.82); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes message-enter {
      from { opacity: 0; transform: translate3d(0, 5px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes error-enter {
      from { opacity: 0; transform: translate3d(0, 4px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    @media (max-width: 480px) {
      .container { border-radius: 22px; }
      .logo { width: 62px; height: 62px; border-radius: 19px; }
      #ip { min-height: 68px; font-size: clamp(21px, 6vw, 28px); }
      .button-group { flex-direction: column; }
      button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="ambient one" aria-hidden="true"></div>
  <div class="ambient two" aria-hidden="true"></div>
  <div class="ambient three" aria-hidden="true"></div>

  <main class="container">
    <div class="content">
      <div class="logo" aria-hidden="true">🌐</div>
      <h1>Your Public IP Address</h1>
      <p class="subtitle">See the network address that websites can see when you connect.</p>

      <p id="status" role="status" aria-live="polite">Preparing the IP address check…</p>

      <div id="ip" data-state="loading" aria-label="Your public IP address">
        <div class="loading-content">
          <span class="loader" aria-hidden="true"></span>
          <span>Retrieving your IP address<span id="loadingDots">…</span></span>
        </div>
      </div>

      <div class="progress" id="progress" aria-hidden="true">
        <div class="progress-bar"></div>
      </div>

      <div class="button-group">
        <button id="copyBtn" type="button" disabled>📋 Copy IP Address</button>
        <button id="retryBtn" type="button" hidden>↻ Retry Connection</button>
      </div>

      <div id="copyMessage" aria-live="polite"></div>

      <div class="meta">
        <span class="dot" aria-hidden="true"></span>
        <span>IPIFY API · LIVE LOOKUP</span>
      </div>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const API_URL = "https://api.ipify.org?format=json";
      const TIMEOUT_MS = 8000;

      const els = {
        status: document.getElementById("status"),
        ip: document.getElementById("ip"),
        copy: document.getElementById("copyBtn"),
        retry: document.getElementById("retryBtn"),
        copyMessage: document.getElementById("copyMessage"),
        progress: document.getElementById("progress")
      };

      let currentIP = "";
      let activeController = null;
      let dotTimer = null;
      let requestId = 0;

      function setLoadingMarkup() {
        els.ip.dataset.state = "loading";
        els.ip.innerHTML = `
          <div class="loading-content">
            <span class="loader" aria-hidden="true"></span>
            <span>Retrieving your IP address<span id="loadingDots">…</span></span>
          </div>`;
      }

      function startDots() {
        stopDots();
        let count = 0;
        dotTimer = window.setInterval(() => {
          const dots = document.getElementById("loadingDots");
          if (dots) {
            count = (count + 1) % 4;
            dots.textContent = ".".repeat(count || 1);
          }
        }, 360);
      }

      function stopDots() {
        if (dotTimer !== null) {
          window.clearInterval(dotTimer);
          dotTimer = null;
        }
      }

      function showError(message) {
        els.status.textContent = "";
        const error = document.createElement("span");
        error.className = "error";
        error.textContent = message;
        els.status.append(error);

        els.ip.dataset.state = "error";
        els.ip.textContent = "—";
        els.copy.disabled = true;
        els.retry.hidden = false;
        els.progress.hidden = true;
      }

      async function fetchIP() {
        const thisRequest = ++requestId;

        // Cancel any previous attempt so rapid clicks cannot race each other.
        if (activeController) activeController.abort();
        activeController = new AbortController();

        currentIP = "";
        els.copy.disabled = true;
        els.retry.hidden = true;
        els.copyMessage.replaceChildren();
        els.status.textContent = "Connecting to the IP detection service…";
        els.progress.hidden = false;
        setLoadingMarkup();
        startDots();

        const timeoutId = window.setTimeout(() => {
          if (activeController && thisRequest === requestId) activeController.abort();
        }, TIMEOUT_MS);

        try {
          // A tiny pause lets the loading state render without delaying the request much.
          await new Promise(resolve => requestAnimationFrame(resolve));
          const response = await fetch(API_URL, {
            method: "GET",
            signal: activeController.signal,
            cache: "no-store",
            headers: { "Accept": "application/json" }
          });

          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();

          if (thisRequest !== requestId) return;
          if (typeof data.ip !== "string" || !data.ip.trim()) {
            throw new Error("Invalid IP response");
          }

          currentIP = data.ip.trim();
          els.ip.dataset.state = "ready";
          els.ip.textContent = currentIP;
          els.status.textContent = "Lookup complete — public IP address found.";
          els.copy.disabled = false;
          els.progress.hidden = true;
        } catch (error) {
          if (thisRequest !== requestId) return;

          if (error.name === "AbortError") {
            showError("The request timed out or was cancelled. Check your connection and try again.");
          } else if (error instanceof TypeError) {
            showError("A network error occurred. Check your connection, DNS, or content blocker and try again.");
          } else {
            showError("The IP service returned an unexpected response. Please try again.");
          }
        } finally {
          window.clearTimeout(timeoutId);
          if (thisRequest === requestId) {
            stopDots();
            activeController = null;
          }
        }
      }

      async function copyIP() {
        if (!currentIP) return;

        try {
          if (!navigator.clipboard || !window.isSecureContext) {
            throw new Error("Clipboard API unavailable");
          }
          await navigator.clipboard.writeText(currentIP);
          els.copyMessage.textContent = "";
          const message = document.createElement("span");
          message.className = "success-message";
          message.textContent = "✓ IP address copied to clipboard";
          els.copyMessage.append(message);
        } catch {
          // Fallback for older browsers or insecure local-file contexts.
          const field = document.createElement("textarea");
          field.value = currentIP;
          field.setAttribute("readonly", "");
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.append(field);
          field.select();
          const copied = document.execCommand("copy");
          field.remove();

          els.copyMessage.textContent = "";
          const message = document.createElement("span");
          message.className = copied ? "success-message" : "error";
          message.textContent = copied ? "✓ IP address copied to clipboard" : "Could not copy automatically. Select the IP address and copy it manually.";
          els.copyMessage.append(message);
        }

        window.setTimeout(() => els.copyMessage.replaceChildren(), 2400);
      }

      els.copy.addEventListener("click", copyIP);
      els.retry.addEventListener("click", fetchIP);
      fetchIP();
    })();
  </script>
</body>
</html>
